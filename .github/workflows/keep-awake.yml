# Render's free plan puts the demo to sleep after about 15 minutes without
# traffic, and waking it takes up to a minute. This pings the health check so
# the demo opens quickly for judges. Delete this file once judging is over.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://scopebill.onrender.com/api/health
